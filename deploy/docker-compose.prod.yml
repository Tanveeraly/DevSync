# Production stack for a single EC2 instance. The database is Neon (managed Postgres),
# so only the API and the Caddy reverse proxy run here.
# CI copies this to the server as ~/devsync/docker-compose.yml.
# Secrets come from ~/devsync/.env (created once by hand, see DEPLOYMENT.md).

services:
  api:
    # CI exports API_IMAGE (ghcr.io/<owner>/devsync-backend:<sha>) when deploying
    image: ${API_IMAGE:?set API_IMAGE}
    restart: unless-stopped
    env_file: .env
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
